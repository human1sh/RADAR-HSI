[build-system]
requires      = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name          = "hyperspectral-sensor-ml"
version       = "0.1.0"
description   = "Leakage-aware hyperspectral land-cover ML under simulated sensor noise"
readme        = "README.md"
authors       = [{ name = "Himanshu Bhisikar" }]
dependencies  = ["numpy", "scipy", "scikit-learn", "torch", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev           = ["pytest", "pytest-cov", "black", "ruff"]

[tool.setuptools.packages.find]
where         = ["."]

[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py"]